<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burrowlight</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="home" class="screen panel-screen">
      <div class="panel">
        <h1>Burrowlight</h1>
        <p class="subtitle">A cozy co-op roguelike</p>
        <label for="name">Your name</label>
        <input id="name" maxlength="16" autocomplete="off" />
        <button id="create" class="primary">Make a burrow</button>
        <div class="divider"><span>or join friends</span></div>
        <div class="row">
          <input id="code" maxlength="5" placeholder="CODE" autocomplete="off" spellcheck="false" />
          <button id="join">Join</button>
        </div>
        <p id="home-error" class="error" role="alert"></p>
      </div>
    </main>

    <main id="lobby" class="screen panel-screen" hidden>
      <div class="panel">
        <p class="label">Burrow code</p>
        <p id="lobby-code" class="code"></p>
        <button id="copy-link">Copy invite link</button>
        <ul id="lobby-players"></ul>
        <div class="row">
          <button id="ready" class="primary">I'm ready</button>
          <button id="start" hidden>Start the run</button>
        </div>
        <p id="lobby-hint" class="hint"></p>
        <p id="lobby-error" class="error" role="alert"></p>
      </div>
    </main>

    <main id="game" class="screen" hidden>
      <div id="canvas-host"></div>
      <div id="hud">
        <ul id="party"></ul>
        <div id="banner"></div>
        <div id="help">
          <kbd>Space</kbd> lantern &middot; <kbd>E</kbd> turn the mirror you're on &middot; WASD to move &middot; light or a friend keeps you calm
        </div>
        <div id="debug"></div>
      </div>
    </main>

    <div id="runover" class="panel-screen" hidden>
      <div class="panel">
        <h1>Eek!</h1>
        <p class="subtitle">Everyone got the jitters at once. The run is over.</p>
        <button id="again" class="primary">Back to the burrow</button>
      </div>
    </div>

    <div id="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
